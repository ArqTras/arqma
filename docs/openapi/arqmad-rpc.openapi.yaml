openapi: 3.0.3
info:
  title: Arqmad RPC
  version: 0.1.0
  description: >
    Minimal OpenAPI scaffold for selected Arqma daemon endpoints during the
    upgrade branch modernization work.
servers:
  - url: http://127.0.0.1:19994
paths:
  /json_rpc:
    post:
      summary: Call JSON-RPC methods such as get_info or get_service_nodes
      operationId: jsonRpc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
            examples:
              getInfo:
                value:
                  jsonrpc: "2.0"
                  id: "0"
                  method: get_info
              getServiceNodes:
                value:
                  jsonrpc: "2.0"
                  id: "1"
                  method: get_service_nodes
                  params:
                    include_json: false
                    offset: 0
                    limit: 100
      responses:
        '200':
          description: JSON-RPC response envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'
  /storage_server/ping:
    get:
      summary: Check storage integration reachability
      operationId: storageServerPing
      responses:
        '200':
          description: Ping status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
  /arqnet/ping:
    get:
      summary: Check Arq-Net reachability
      operationId: arqnetPing
      responses:
        '200':
          description: Ping status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
components:
  schemas:
    JsonRpcRequest:
      type: object
      required:
        - jsonrpc
        - id
        - method
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          oneOf:
            - type: string
            - type: integer
        method:
          type: string
          enum:
            - get_info
            - get_service_nodes
            - get_arqnet_status
            - get_storage_status
            - get_block_header_by_hash
            - get_block_headers_range
        params:
          oneOf:
            - type: object
              additionalProperties: true
            - $ref: '#/components/schemas/GetServiceNodesParams'
            - $ref: '#/components/schemas/GetBlockHeadersRangeParams'
    BatchLimits:
      type: object
      description: Soft DoS caps enforced by rpc_validation helpers
      properties:
        max_tx_hashes_per_request:
          type: integer
          const: 100
        max_key_images_per_request:
          type: integer
          const: 1000
        max_block_heights_per_request:
          type: integer
          const: 100
        max_block_hashes_per_request:
          type: integer
          const: 100
        max_block_headers_range:
          type: integer
          const: 1000
    GetBlockHeadersRangeParams:
      type: object
      required: [start_height, end_height]
      properties:
        start_height:
          type: integer
          format: uint64
          minimum: 0
        end_height:
          type: integer
          format: uint64
          minimum: 0
        fill_pow_hash:
          type: boolean
          default: false
    JsonRpcResponse:
      type: object
      required:
        - jsonrpc
        - id
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          oneOf:
            - type: string
            - type: integer
        result:
          type: object
          additionalProperties: true
        error:
          type: object
          additionalProperties: true
    PingResponse:
      type: object
      properties:
        status:
          type: string
        success:
          type: boolean
    GetServiceNodesParams:
      type: object
      properties:
        service_node_pubkeys:
          type: array
          description: >
            Optional list of service node public keys to filter against. Each key
            must be a non-empty 32-byte hex string.
          items:
            type: string
        include_json:
          type: boolean
          description: Include the legacy raw JSON blob in `as_json`.
          default: false
        offset:
          type: integer
          format: uint64
          description: >
            Zero-based pagination offset applied after service node filtering.
          minimum: 0
          default: 0
        limit:
          type: integer
          format: uint64
          description: >
            Optional pagination limit. When omitted or zero, the daemon returns
            the full filtered result set.
          minimum: 0
          default: 0
    GetServiceNodesResult:
      type: object
      properties:
        service_node_states:
          type: array
          items:
            type: object
            additionalProperties: true
        height:
          type: integer
          format: uint64
        block_hash:
          type: string
        as_json:
          type: string
        status:
          type: string
