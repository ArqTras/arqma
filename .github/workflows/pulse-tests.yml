# Build unit_tests with BUILD_TESTS=ON and run GTest filter Pulse* (see summary-pos.md).
name: ci/pulse-unit-tests

on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: pulse-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pulse-gtest:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git build-essential curl ca-certificates cmake pkg-config \
            libboost-all-dev libssl-dev libzmq3-dev libsodium-dev \
            libnettle-dev libhogweed-dev libunbound-dev \
            libunwind-dev liblzma-dev libreadline-dev libldns-dev libexpat1-dev \
            gperf autoconf automake libtool-bin libhidapi-dev libusb-1.0-0-dev libudev-dev

      - name: Configure and build unit_tests
        run: |
          cmake -S . -B build-ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DBUILD_DOCUMENTATION=OFF
          cmake --build build-ci --target unit_tests -j"$(nproc)"

      - name: Run Pulse* unit tests
        run: |
          U="$(find build-ci -name unit_tests -type f -perm -111 | head -n1)"
          test -n "$U"
          echo "Running: $U"
          "$U" --gtest_filter='Pulse*' --gtest_color=yes
